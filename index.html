<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Insurance Prediction</title>
    <link rel="stylesheet" href="style.css">
    <body>
        <div class="container">
            <h2>Life Insurance Eligibility Prediction</h2>
            <form id="predictForm">
                <label for="age">Age:</label>
                <input type="number" id="age" required min="1" max="100">
                
                <label for="gender">Gender:</label>
                <select id="gender" required>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
    
                <label for="income">Annual Income ($):</label>
                <input type="number" id="income" required min="0">
    
                <label for="health">Health Status:</label>
                <select id="health" required>
                    <option value="Excellent">Excellent</option>
                    <option value="Good">Good</option>
                    <option value="Average">Average</option>
                    <option value="Poor">Poor</option>
                </select>
    
                <label for="smoke">Do you smoke?</label>
                <select id="smoke" required>
                    <option value="Yes">Yes</option>
                    <option value="No">No</option>
                </select>
    
                <button type="submit">Predict Eligibility</button>
            </form>
    
            <div id="result"></div>
            <div id="policies"></div>
            <div id="premiums"></div>
            <div id="suggestions"></div>
        </div>
    </body>


    <script src="script.js"></script>
    </html>
